name: textara
description: "Textara - A premium DRM-free EPUB and PDF reader."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Database
  sqflite: ^2.4.1
  sqlite3_flutter_libs: ^0.5.28

  # File handling
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  path: ^1.9.1

  # EPUB parsing
  epub_pro: ^5.6.0
  html: ^0.15.5

  # PDF (2.x required for Dart 3.14; 1.x fails null-safety compile)
  pdfrx: ^2.2.15

  # UI and design
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.1
  equatable: ^2.0.7
  shared_preferences: ^2.3.4

  # TTS
  flutter_tts: ^4.2.0

  # Share + local reminders
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1

  # Export
  pdf: ^3.11.2
  encrypt: ^5.0.3
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4+4
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#F5F0E8"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

flutter_native_splash:
  color: "#F5F0E8"
  image: assets/branding/splash.png
  android_12:
    color: "#F5F0E8"
    image: assets/branding/splash.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sample/
    - assets/branding/
    - assets/fonts/licenses/
  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
    - family: Source Serif Pro
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
