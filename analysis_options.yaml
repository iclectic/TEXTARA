# Analyzer / linter configuration for Textara.
#
# Flutter 3.50+ deprecates `package:flutter/material.dart` in favour of
# `material_ui` — migrating the whole UI is tracked separately in PLAN.md.
# Until then, suppress that deprecation so CI stays actionable.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - macos/**
  errors:
    deprecated_member_use: ignore
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
    prefer_final_locals: true
    require_trailing_commas: true
