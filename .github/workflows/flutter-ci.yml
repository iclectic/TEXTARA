name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # Infos alone must not fail the job (Flutter 3.50+ exits 1 on infos by default).
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Unit, widget, and a11y tests
        run: flutter test

      - name: Knowledge-loop smoke (integration_test, flutter-tester)
        run: flutter test integration_test/knowledge_loop_smoke_test.dart -d flutter-tester
